name: Auditoria de imagens (folhas de contato)

on:
  push:
    branches: [auditoria-imagens]
    paths: ['auditoria/atual.json', 'auditoria/buscas.json', 'auditoria/auditoria.py']

permissions:
  contents: write

concurrency:
  group: auditoria-imagens
  cancel-in-progress: true

jobs:
  folhas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Pillow
        run: pip install --quiet pillow
      - name: Gerar folhas
        run: |
          rm -rf auditoria/saida
          if git diff --name-only HEAD~1 HEAD | grep -q 'auditoria/atual.json'; then python3 auditoria/auditoria.py atual; fi
          if git diff --name-only HEAD~1 HEAD | grep -q 'auditoria/buscas.json'; then python3 auditoria/auditoria.py buscas; fi
      - name: Salvar no branch
        run: |
          git config user.name "auditoria-bot"
          git config user.email "auditoria-bot@users.noreply.github.com"
          git add -f auditoria/saida
          git commit -m "Folhas de contato [skip ci]" || echo "nada novo"
          git push
