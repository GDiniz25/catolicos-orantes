name: catalogo
on: { push: { branches: [catalogo-milagres], paths: [extrair.py, .github/workflows/catalogo.yml] } }
permissions: { contents: write }
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por tesseract-ocr-ita > /dev/null && pip install -q pillow
      - run: python3 extrair.py > catalogo-log.txt 2>&1 || true
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add catalogo catalogo-log.txt && git commit -m "catalogo extraido" && git push
