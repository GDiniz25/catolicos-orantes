name: baixar imagens biblia
on: { push: { branches: [verificar-imagens], paths: [biblia-img.json, baixar-biblia.mjs] } }
permissions: { contents: write }
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save sharp@0.33.5
      - run: node baixar-biblia.mjs
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add biblia-img
          git commit -m "imagens biblia" || exit 0
          git pull --rebase
          git push
