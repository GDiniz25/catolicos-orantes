name: retratos dos santos
on: { push: { branches: [verificar-imagens], paths: [santos-busca.mjs, santos-busca2.mjs, cf-busca.mjs, cf-q.json, .github/workflows/santos.yml] } }
permissions: { contents: write }
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i sharp@0.33.5 --no-save
      - env:
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node cf-busca.mjs
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A cf && git commit -m "santos: candidatos" && git pull --rebase && git push
