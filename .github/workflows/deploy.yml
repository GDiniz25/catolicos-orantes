name: Build e deploy (Hostinger)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      espelhar:
        description: 'Copiar as imagens para a Hostinger (sim/nao)'
        required: false
        default: 'sim'
  # Disparado pelo botão "Publicar alterações no site" do /admin e pela publicação agendada
  repository_dispatch:
    types: [rebuild]
  schedule:
    - cron: '5 3 * * *'   # 00:05 em Brasília: liturgia, santo e versículo do novo dia
    - cron: '0 10 * * *'  # 07:00 em Brasília: reforço

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Publicação normal leva poucos minutos; a primeira com a lista de envio vazia manda o site todo
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (gera o site estático em dist/)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Só para o build gravar o cache da liturgia (nunca vai para o site)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_LOGIN_GOOGLE: ${{ vars.PUBLIC_LOGIN_GOOGLE }}
        run: npm run build

      - name: Recuperar cópia das imagens (cache entre builds)
        if: ${{ github.event.inputs.espelhar != 'nao' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/imagens
          key: imagens-${{ github.run_id }}
          restore-keys: imagens-

      - name: Servir as imagens pelo próprio site (sem depender do Supabase na visita)
        if: ${{ github.event.inputs.espelhar != 'nao' }}
        run: node scripts/espelhar-imagens.mjs

      # Salva já aqui (e não só no fim): se o envio falhar, a próxima publicação não baixa tudo de novo
      - name: Guardar cópia das imagens
        if: ${{ always() && github.event.inputs.espelhar != 'nao' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/imagens
          key: imagens-${{ github.run_id }}

      - name: Conferir arquivos essenciais
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/.htaccess
          echo "Páginas geradas: $(find dist -name '*.html' | wc -l)"

      # Imagens primeiro, com lftp: retoma de onde parou e só envia o que ainda não existe
      # (o nome de cada imagem leva a versão, então tamanho igual = arquivo igual)
      - name: Enviar imagens para a Hostinger (lftp, com retomada)
        timeout-minutes: 12
        if: ${{ github.event.inputs.espelhar != 'nao' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          for tentativa in 1 2 3; do
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; set net:max-retries 4; set net:reconnect-interval-base 5; set net:timeout 60; mirror -R --ignore-time --parallel=3 --no-perms dist/img/ img/; quit" && break
            echo "Tentativa $tentativa falhou; tentando de novo em 20 s"; sleep 20
          done

      # Páginas e arquivos do site (sem as imagens), com lftp em paralelo.
      # Só vai o que mudou desde a última publicação que deu certo (lista de hashes guardada em cache).
      - name: Recuperar lista do que já está no ar
        uses: actions/cache/restore@v4
        with:
          path: .cache/enviados.txt
          key: enviados-${{ github.run_id }}
          restore-keys: enviados-

      - name: Separar o que mudou
        run: |
          mkdir -p .cache envio
          (cd dist && find . -type f ! -path './img/*' -print0 | sort -z | xargs -0 sha1sum) > .cache/agora.txt
          touch .cache/enviados.txt
          # linhas novas ou alteradas = arquivos a enviar
          comm -13 <(sort .cache/enviados.txt) <(sort .cache/agora.txt) | cut -c43- > .cache/mudou.txt
          echo "Arquivos a enviar: $(wc -l < .cache/mudou.txt) de $(wc -l < .cache/agora.txt)"
          (cd dist && tr '\n' '\0' < ../.cache/mudou.txt | xargs -0 -r cp --parents -t ../envio)

      - name: Enviar para a Hostinger (lftp, em paralelo)
        timeout-minutes: 25
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          which lftp > /dev/null || sudo apt-get install -y -qq lftp > /dev/null
          if [ -z "$(ls -A envio)" ]; then echo "Nada mudou"; exit 0; fi
          ok=0
          for tentativa in 1 2 3; do
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; set net:max-retries 4; set net:reconnect-interval-base 5; set net:timeout 60; mirror -R --parallel=8 --no-perms --no-empty-dirs envio/ ./; quit" && { ok=1; break; }
            echo "Tentativa $tentativa falhou; tentando de novo em 20 s"; sleep 20
          done
          [ "$ok" = 1 ]
          cp .cache/agora.txt .cache/enviados.txt

      - name: Guardar lista do que está no ar
        uses: actions/cache/save@v4
        with:
          path: .cache/enviados.txt
          key: enviados-${{ github.run_id }}

      - name: Avisar buscadores (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs
