name: verificar imagens
on: { push: { branches: [verificar-imagens], paths: [fixas.json, check.mjs, busca.mjs, buscas.json, .github/workflows/check.yml] } }
permissions: { contents: write }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node busca.mjs > resultado.txt
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add resultado.txt && git commit -m resultado && git push
