name: aplicar foco
on: { push: { branches: [verificar-imagens], paths: [aplicar.json] } }
permissions: { contents: write }
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node aplicar.mjs | tee aplicado.txt
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add aplicado.txt && git commit -m "foco aplicado" && git pull --rebase && git push
